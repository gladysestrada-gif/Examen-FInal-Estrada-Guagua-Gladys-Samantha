<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samanistra S.A. - Gestión de Servicios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="fas fa-hard-hat"></i> Samanistra S.A.
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="#" id="nav-services">
                            <i class="fas fa-tools"></i> Servicios
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-12 text-center mb-4">
                <h1 class="display-4">
                    <i class="fas fa-building"></i> Gestión de Servicios
                </h1>
                <p class="lead">Samanistra S.A. - Excelencia en Ingeniería y Mantenimiento</p>
                <hr>
            </div>
        </div>

        <div class="row mb-4">
            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0" id="form-title">
                            <i class="fas fa-plus-circle"></i> Nuevo Servicio
                        </h5>
                    </div>
                    <div class="card-body">
                        <form id="service-form">
                            <input type="hidden" id="service-id">
                            
                            <div class="mb-3">
                                <label for="name" class="form-label">Nombre del Servicio *</label>
                                <input type="text" class="form-control" id="name" required>
                            </div>
                            
                            <div class="mb-3">
                                <label for="category" class="form-label">Categoría *</label>
                                <select class="form-select" id="category" required>
                                    <option value="">Seleccionar categoría</option>
                                    <option value="INGENIERÍA CIVIL">🏗️ Ingeniería Civil</option>
                                    <option value="INGENIERÍA MECÁNICA">⚙️ Ingeniería Mecánica</option>
                                    <option value="INGENIERÍA INDUSTRIAL">🏭 Ingeniería Industrial</option>
                                    <option value="MANTENIMIENTO ELÉCTRICO">⚡ Mantenimiento Eléctrico</option>
                                    <option value="AIRES ACONDICIONADO">❄️ Aires Acondicionados</option>
                                    <option value="PINTURA">🎨 Pintura</option>
                                    <option value="TELECOMUNICACIONES">📡 Telecomunicaciones</option>
                                    <option value="FUMIGACIÓN">🐜 Fumigación</option>
                                    <option value="CERRAGERÍA">🔐 Cerrajería</option>
                                    <option value="CONSTRUCCIÓN METÁLICA">🔩 Construcción Metálica</option>
                                </select>
                            </div>
                            
                            <div class="mb-3">
                                <label for="description" class="form-label">Descripción *</label>
                                <textarea class="form-control" id="description" rows="3" required></textarea>
                            </div>
                            
                            <div class="mb-3">
                                <label for="duration" class="form-label">Duración Estimada *</label>
                                <input type="text" class="form-control" id="duration" placeholder="Ej: 2 días, 1 semana" required>
                            </div>
                            
                            <div class="mb-3">
                                <label for="price" class="form-label">Precio (USD) *</label>
                                <input type="number" class="form-control" id="price" step="0.01" required>
                            </div>
                            
                            <div class="mb-3">
                                <label for="status" class="form-label">Estado</label>
                                <select class="form-select" id="status">
                                    <option value="activo">Activo</option>
                                    <option value="inactivo">Inactivo</option>
                                </select>
                            </div>
                            
                            <button type="submit" class="btn btn-primary w-100" id="submit-btn">
                                <i class="fas fa-save"></i> Guardar Servicio
                            </button>
                            <button type="button" class="btn btn-secondary w-100 mt-2" id="cancel-btn" style="display: none;">
                                <i class="fas fa-times"></i> Cancelar
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0">
                            <i class="fas fa-list"></i> Catálogo de Servicios
                        </h5>
                    </div>
                    <div class="card-body">
                        <div id="services-list" class="row">
                            <div class="text-center">
                                <div class="spinner-border text-primary" role="status">
                                    <span class="visually-hidden">Cargando...</span>
                                </div>
                                <p>Cargando servicios...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="deleteModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title">Confirmar Eliminación</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p>¿Estás seguro de que deseas eliminar este servicio?</p>
                    <p id="delete-service-name" class="fw-bold"></p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-danger" id="confirm-delete">Eliminar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
